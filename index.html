<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LOGISYS 사이트 지도</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
    #map{position:fixed;inset:0;background:#eef3f6}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:14px;pointer-events:none;z-index:2}
  </style>
  <script>
    (()=>{const u=new URL(location.href);if(u.searchParams.get('lmLive')!=='1'){u.searchParams.set('lmLive','1');u.searchParams.set('share','1');history.replaceState(null,'',u)}})();
  </script>
</head>
<body>
  <div id="map"></div><div id="boot">LOGISYS 최신 사이트 지도 준비 중…</div>
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=7qlkzlucix"></script>
  <script>
    var map=new naver.maps.Map('map',{center:new naver.maps.LatLng(34.9,127.25),zoom:8,minZoom:6,zoomControl:!matchMedia('(max-width:700px)').matches,zoomControlOptions:{position:naver.maps.Position.RIGHT_CENTER}});
    document.getElementById('boot').remove();
  </script>
  <script src="site-map-live-main.js?v=3"></script>
  <script src="share-map-host.js?v=2"></script>
</body>
</html>
