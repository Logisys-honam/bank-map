)).slice(0,30);res.innerHTML='';if(!a.length){res.innerHTML='<div class="result"><small>검색 결과가 없습니다.</small></div>';res.classList.remove('hidden');return}a.forEach(it=>{const d=document.createElement('div');d.className='result';d.innerHTML='<strong>'+esc(it.x.name)+'</strong><small>'+it.x.quarter+'분기 · '+months[it.x.quarter]+(completed[it.x.id]?' · 완료':'')+'</small>';d.onclick=()=>{map.setCenter(it.pos);map.setZoom(16);if(opened)opened.close();it.iw.setContent(popupHtml(it.x));it.iw.open(map,it.m);opened=it.iw;res.classList.add('hidden')};res.appendChild(d)});res.classList.remove('hidden')}document.getElementById('memoAdd').onclick=addMemo;document.getElementById('memoDone').onclick=memoToggleDone;document.getElementById('memoCancel').onclick=closeMemo;document.getElementById('memoOverlay').addEventListener('click',e=>{if(e.target.id==='memoOverlay')closeMemo()});naver.maps.Event.addListener(map,'click',()=>{if(opened){opened.close();opened=null}closeMemo()});document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.classList.add('hidden')});updateCounts();initFirebase();</script></body></html>
