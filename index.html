ue.TIMESTAMP})}else if(cur.memo){await db.ref(basePath+'/'+id).update({done:false,updatedAt:firebase.database.ServerValue.TIMESTAMP})}else{await db.ref(basePath+'/'+id).remove()}}catch(e){alert('완료 상태 저장에 실패했습니다.');console.error(e)}};function openPopup(it){if(opened)opened.close();it.iw.setContent(popupHtml(it.x));it.iw.open(map,it.m);opened=it.iw}function startHold(it){clearTimeout(it.hold);it.hold=setTimeout(()=>{suppressClick=true;openMemo(it);setTimeout(()=>suppressClick=false,450)},650)}function stopHold(it){clearTimeout(it.hold)}data.forEach(x=>{const pos=new naver.maps.LatLng(x.lat,x.lng);bounds.extend(pos);const m=new naver.maps.Marker({position:pos,map,icon:markerIcon(x)});const iw=new naver.maps.InfoWindow({borderWidth:0,backgroundColor:'#fff',anchorSize:new naver.maps.Size(12,12)});const it={x,m,iw,pos,hold:null};items.push(it);naver.maps.Event.addListener(m,'click',()=>{if(suppressClick)return;openPopup(it)});naver.maps.Event.addListener(m,'mousedown',()=>startHold(it));naver.maps.Event.addListener(m,'mouseup',()=>stopHold(it));naver.maps.Event.addListener(m,'touchstart',()=>startHold(it));naver.maps.Event.addListener(m,'touchend',()=>stopHold(it));});if(data.length>1)map.fitBounds(bounds,{top:45,right:30,bottom:30,left:30});else if(data.length===1){map.setCenter(items[0].pos);map.setZoom(15)};function closeMemo(){document.getElementById('memoOverlay').classList.add('hidden');memoItem=null}function renderMemoList(){const box=document.getElementById('memoList');box.innerHTML='';if(!memoItem)return;const ms=branchMemos(memoItem.x);if(!ms.length){box.innerHTML='<div class="memo-entry"><div class="memo-entry-text">등록된 메모가 없습니다.</div></div>';return}ms.forEach(m=>{const d=document.createElement('div');d.className='memo-entry '+(m.done?'done':'');d.innerHTML='<div class="memo-entry-head"><span class="memo-entry-no">'+esc((m.no||'')+'번 메모')+'</span><span class="memo-entry-state">'+(m.done?'완료':'진행중')+'</span></div><div class="memo-entry-text">'+esc(m.text||'')+'
