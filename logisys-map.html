<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGISYS 사이트 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIINfQ3ynhAt3mMIGMZb63qK2I5b3jHqfek=" crossorigin="">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f6;font-family:Arial,"Malgun Gothic",sans-serif}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#5d6b7c;font-size:14px}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  const boot=document.getElementById('boot');
  if(window.L){
    if(boot)boot.textContent='지도 엔진 준비 완료';
    document.dispatchEvent(new Event('lm-logisys-leaflet-ready'));
  }else{
    if(boot)boot.textContent='Leaflet 지도 엔진 로딩 실패';
  }
});
</script>
</head>
<body>
<div id="boot">LOGISYS 지도 준비 중…</div>
</body>
</html>
