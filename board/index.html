<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>순천센터 공용 업무보드</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="titlebox">
    <h1>순천센터 공용 업무보드</h1>
    <div id="sync" class="sync">연결 중...</div>
  </div>
  <a class="map-btn" href="../">은행 지도</a>
</header>

<main class="page">
  <section class="summary-row">
    <button class="summary-card active" data-summary="all">
      <span>전체 지점</span><b id="cBranches">0</b>
    </button>
    <button class="summary-card" data-summary="memo">
      <span>메모 있는 곳</span><b id="cMemoBranches">0</b>
    </button>
    <button class="summary-card" data-summary="todo">
      <span>진행중 메모</span><b id="cTodo">0</b>
    </button>
    <button class="summary-card" data-summary="done">
      <span>완료 메모</span><b id="cDone">0</b>
    </button>
  </section>

  <section class="controls">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="지점명 또는 메모내용 검색">
    </div>
    <select id="writer">
      <option value="">작성자 선택</option>
      <option>김준호</option>
      <option>장창형</option>
      <option>김대한</option>
      <option>관리자</option>
    </select>
    <select id="sort">
      <option value="todoFirst">진행중 우선</option>
      <option value="name">지점명순</option>
      <option value="latest">최근 메모순</option>
    </select>
  </section>

  <nav id="staffTabs" class="staff-tabs"></nav>

  <section class="workspace">
    <div class="list-panel">
      <div class="list-head">
        <div>지점</div>
        <div>최근 메모</div>
        <div>상태</div>
      </div>
      <div id="branchList" class="branch-list"></div>
      <div id="empty" class="empty hidden">표시할 지점이 없습니다.</div>
    </div>

    <aside id="detailPanel" class="detail-panel">
      <div class="detail-empty">
        왼쪽에서 지점을 선택하면<br>메모 전체 내용을 볼 수 있습니다.
      </div>
    </aside>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modalTitle">메모 추가</h2>
    <textarea id="memoText" placeholder="공유할 업무 메모를 입력하세요."></textarea>
    <div class="modal-buttons">
      <button id="cancel" class="btn secondary">취소</button>
      <button id="save" class="btn primary">추가</button>
    </div>
  </div>
</div>

<script src="../config.js"></script>
<script src="../data.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="./app.js"></script>
</body>
</html>
